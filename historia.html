<!DOCTYPE html>
<html lang="es">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Historia</title>
		<style>
			/* Estilos mínimos para legibilidad */
			body { font-family: Arial, Helvetica, sans-serif; line-height: 1.6; padding: 24px; color: #222; }
			header { margin-bottom: 16px; }
			section.managua { background: #f8f8f8; padding: 16px; border-radius: 6px; max-width: 800px; }
			h1,h2 { color: #0a3d62; margin: 0 0 8px 0; }
			p { margin: 0; }
		</style>
	</head>
	<body>
		<header>
			<h1>Historia</h1>
		</header>

		<main>
			<section class="managua" id="managua-history">
				<h2>Breve historia de Managua</h2>
				<p>
					Managua, capital de Nicaragua, tiene una historia que combina raíces indígenas,
					época colonial y desarrollo urbano. Fundada oficialmente en el siglo XIX, la ciudad
					ha sido testigo de importantes hechos históricos y reconstrucciones por terremotos.
				</p>
			</section>
		</main>
	</body>
</html>
