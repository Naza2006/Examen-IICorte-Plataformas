<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Contacto — Managua Guide</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-gray-800">
  <header class="bg-white shadow-md">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="index.html" class="text-2xl font-semibold text-emerald-600">Managua Guide</a>
      <nav class="space-x-4">
        <a href="index.html">Inicio</a>
        <a href="historia.html">Historia</a>
        <a href="lugares.html">Lugares</a>
        <a href="gastronomia.html">Gastronomía</a>
        <a href="contacto.html" class="font-medium">Contacto</a>
      </nav>
    </div>
  </header>
  <main class="max-w-6xl mx-auto px-4 py-10 grid md:grid-cols-2 gap-8">
    <section class="bg-white p-6 rounded-lg shadow">
      <h1 class="text-2xl font-semibold">Contáctanos</h1>
      <form id="contactForm" class="mt-4 space-y-4">
        <div>
          <label class="block text-sm">Nombre</label>
          <input type="text" name="name" required class="mt-1 w-full border rounded px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm">Correo</label>
          <input type="email" name="email" required class="mt-1 w-full border rounded px-3 py-2" />
        </div>
        <div>
          <label class="block text-sm">Mensaje</label>
          <textarea name="message" rows="4" required class="mt-1 w-full border rounded px-3 py-2"></textarea>
        </div>
        <button type="submit" class="px-4 py-2 bg-emerald-600 text-white rounded">Enviar</button>
        <p id="status" class="text-sm mt-2 text-green-600 hidden">Mensaje enviado (simulado)</p>
      </form>
    </section>
    <section class="bg-white p-4 rounded-lg shadow">
      <h2 class="font-semibold mb-3">Mapa — Managua, Nicaragua</h2>
      <iframe title="Mapa Managua" width="100%" height="320" style="border:0" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=Managua,Nicaragua&output=embed"></iframe>
    </section>
  </main>
  <script>
    document.getElementById('contactForm').addEventListener('submit', function(e){
      e.preventDefault();
      document.getElementById('status').classList.remove('hidden');
      setTimeout(()=>{
        document.getElementById('status').classList.add('hidden');
        e.target.reset();
      }, 1800);
    });
  </script>
</body>
</html>
